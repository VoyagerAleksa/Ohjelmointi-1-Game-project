<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victory</title>
  <link rel="stylesheet" href="victory.css">
  <script src="../audio/sound.js" defer></script>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="horizon-glow"></div>

  <main class="victory-page">
    <section class="victory-card" aria-labelledby="victory-title">
      <div class="victory-top">
        <img src="/assets/pepega.jpg" alt="Victory avatar" class="victory-avatar">
        <div class="victory-heading">
          <h1 id="victory-title">VICTORY</h1>
          <p>You found the lost luggage.</p>
        </div>
      </div>

      <div id="victory-error-box" class="victory-error-box" hidden>
        <h2>VICTORY ERROR</h2>
        <p id="victory-error-text">Could not load session results</p>
      </div>

      <div class="victory-gif-wrap">
        <img src="/assets/giphy.gif" alt="Victory animation" class="victory-gif">
      </div>

      <div class="victory-player">
        <span class="victory-label">Player</span>
        <span class="victory-value" id="victory-player-name">Guest</span>
      </div>

      <div class="victory-stats">
        <div class="victory-stat">
          <span class="victory-label">Points</span>
          <span class="victory-value" id="victory-points">0</span>
        </div>

        <div class="victory-stat">
          <span class="victory-label">Flights</span>
          <span class="victory-value" id="victory-flights">0</span>
        </div>

        <div class="victory-stat">
          <span class="victory-label">Time</span>
          <span class="victory-value" id="victory-time">00:00</span>
        </div>
      </div>

      <div class="victory-actions">
        <!-- <button id="victory-restart-btn" class="victory-btn" type="button">Start new game</button> -->
        <!-- <button id="victory-leaderboard-btn" class="victory-btn" type="button">Leaderboard</button>> -->
        <button id="victory-menu-btn" class="victory-btn secondary" type="button">Main menu</button>
      </div>
    </section>
  </main>

  <script src="/victory/victory.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Sound) {
        Sound.stopMusic();
      }
    });
  </script>
</body>
</html>
